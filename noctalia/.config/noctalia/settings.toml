[idle.behavior.lock]
timeout = 600
command = "noctalia:session lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
command = "noctalia:dpms-off"
resume_command = "noctalia:dpms-on"
enabled = true

[idle.behavior.screensaver]
timeout = 300
command = "screensaver-start"
resume_command = "pkill -f 'class screensaver'"
enabled = true

